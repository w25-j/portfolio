    <path d="M155,312 C174,327 190,335 200,337 C210,335 226,327 245,312" fill="none" stroke="rgba(232,160,64,0.22)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M158,314 C176,328 192,336 200,338 C208,336 224,328 242,314" fill="none" stroke="rgba(232,160,64,0.08)" stroke-width="1"/>
    <!-- 圍巾紋理線 -->
    <line x1="180" y1="328" x2="220" y2="328" stroke="rgba(232,160,64,0.06)" stroke-width="0.8"/>
    <line x1="176" y1="336" x2="224" y2="336" stroke="rgba(232,160,64,0.06)" stroke-width="0.8"/>

    <!-- ── 額頭飾扣（無期迷途風格標誌）─── -->
    <circle cx="200" cy="166" r="6" fill="none" stroke="rgba(232,160,64,0.3)" stroke-width="1.5"/>
    <circle cx="200" cy="166" r="2.5" fill="rgba(232,160,64,0.45)"/>

    <!-- ── 側面光線（戲劇性燈光）─── -->
    <path d="M320,100 C280,140 260,180 280,220 C300,260 340,300 360,340" fill="none" stroke="rgba(232,160,64,0.08)" stroke-width="40"/>

