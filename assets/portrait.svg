<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" aria-label="布丁狗 — 調酒師 × 插畫師 × 風格遊戲肖像">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2a2522"/>
      <stop offset="55%" stop-color="#161310"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="spot" cx="52%" cy="40%" r="40%">
      <stop offset="0%" stop-color="rgba(232,160,64,0.2)"/>
      <stop offset="100%" stop-color="rgba(232,160,64,0)"/>
    </radialGradient>
    <radialGradient id="blL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(232,160,64,0.2)"/>
      <stop offset="100%" stop-color="rgba(232,160,64,0)"/>
    </radialGradient>
    <radialGradient id="blR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,104,74,0.16)"/>
      <stop offset="100%" stop-color="rgba(212,104,74,0)"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0f0d0b"/>
