    <circle cx="224" cy="213" r="5" fill="#fff8ee" opacity="0.9"/>
    <circle cx="176" cy="229" r="2.2" fill="#fff8ee" opacity="0.45"/>
    <circle cx="236" cy="229" r="2.2" fill="#fff8ee" opacity="0.45"/>

