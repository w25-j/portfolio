      <line x1="206" y1="52" x2="203" y2="70" stroke-width="1.1"/>
      <line x1="250" y1="62" x2="247" y2="80" stroke-width="1"/>
      <line x1="294" y1="72" x2="291" y2="90" stroke-width="1.3"/>
