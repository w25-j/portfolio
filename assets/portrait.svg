    <ellipse cx="148" cy="258" rx="30" ry="22" fill="url(#blL)"/>
    <ellipse cx="252" cy="258" rx="30" ry="22" fill="url(#blR)"/>

    <!-- ── 眼睛（琥珀金・無期迷途風格）─── -->
    <!-- 眼眶 -->
    <ellipse cx="170" cy="222" rx="18" ry="20" fill="#0e0c0a"/>
