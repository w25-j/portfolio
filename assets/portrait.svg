  <!-- ═══ 右下角標記 ═══ -->
  <text x="200" y="392" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="9" fill="rgba(232,160,64,0.3)" letter-spacing="2">PUDDING DOG</text>

