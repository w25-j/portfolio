      <line x1="186" y1="92" x2="183" y2="110" stroke-width="0.8"/>
      <line x1="232" y1="86" x2="229" y2="104" stroke-width="1.2"/>
      <line x1="278" y1="96" x2="275" y2="114" stroke-width="1"/>
      <line x1="322" y1="106" x2="319" y2="124" stroke-width="0.9"/>
      <line x1="64" y1="142" x2="60" y2="160" stroke-width="1"/>
      <line x1="112" y1="134" x2="109" y2="152" stroke-width="1.1"/>
      <line x1="160" y1="128" x2="157" y2="146" stroke-width="0.8"/>
      <line x1="208" y1="122" x2="205" y2="140" stroke-width="1.2"/>
