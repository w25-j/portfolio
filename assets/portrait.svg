      <line x1="300" y1="140" x2="297" y2="158" stroke-width="0.9"/>
      <line x1="344" y1="150" x2="341" y2="168" stroke-width="1"/>
      <line x1="86" y1="182" x2="82" y2="200" stroke-width="1"/>
      <line x1="136" y1="176" x2="133" y2="194" stroke-width="1.1"/>
